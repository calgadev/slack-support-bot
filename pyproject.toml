[project]
name = "slack-support-bot"
version = "0.1.0"
description = "Slack support bot that answers from an internal knowledge base with RAG, cites sources and opens tickets via tool calling."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "slack-bolt>=1.30.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[project.scripts]
support-bot = "support_bot.app:main"
support-bot-ingest = "support_bot.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# google-genai ships docstrings with invalid escape sequences
filterwarnings = ["ignore::SyntaxWarning"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
